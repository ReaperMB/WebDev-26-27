<html>
  <head>
    <title>WD Lesson 2.5</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <script src="script.js"></script>
    <!-- Challenge 1: Create a div container with id of banner.  Add a heading 1 with the text "Gallery" to the container.-->
    <div id="banner">
      <h1>Gallery</h1>
    </div>
    <!-- Challenge 2: Create a div container with class of subbanner. Add a heading 3 with appropriate text that
                      represents the theme of the first photo gallery -->
    <div class="subbanner">
      <h3>Games</h3>
    </div>
    <!-- Challenge 3: Add a brief paragraph describing the theme of the first photo gallery -->
    <p>Games are a form of entertainment enjoyed by many people.</p>

    <!-- Challenge 4: Create a div container with a class of gallery and an id of firstGallery.  Add at least three images based 
                      on the theme of the first photo gallery-->
    <div class="gallery" id="firstGallery">
      <img src="https://store-images.s-microsoft.com/image/apps.808.14492077886571533.be42f4bd-887b-4430-8ed0-622341b4d2b0.c8274c53-105e-478b-9f4b-41b8088210a3?q=90&w=512&h=768&mode=crop&format=jpg&background=%23FFFFFF" height="200" width="200">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRB7_x5DkxSh2ZIW1YC1jB1TpPPobmyRtTsPK3EdohXVw&s=10" height="200" width="200">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcShTEEgPqJBYVdFOHPLDy1_j32d9aYRT6JGNpC4R8LN2A&s=10" height="200" width="200">
    </div>
    <!-- Challenge 5: Create a div container with class of subbanner. Add a heading 3 with appropriate text that
                      represents the theme of the second photo gallery -->
    <div class="subbanner">
      <h3>Candy</h3>
    </div>

    <!-- Challenge 6: Add a brief paragraph describing the theme of the second photo gallery -->
    <p>Candy is a sweet treat enjoyed by many people.</p>

    <!-- Challenge 7: Create a div container with a class of gallery and an id of secondGallery.  Add at least three images based on the theme of the second photo gallery-->
     <div class="gallery" id="secondGallery">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTE2owV8MFNTq20klZvCWKF3u6ksJATt04hvcoCXa4qZg&s=10" height="200" width="200">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQg7Po9a_S4YEJsv6Q5BDYBvQV1CnXPjhL6d4LaV0Mp4A&s=10" height="200" width="200">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS3V3ojppVSYh3amtXu196mgGAml6RHdBH5Bg0Ps-7q9g&s=10" height="200" width="200">
     </div>
  </body>
</html>
